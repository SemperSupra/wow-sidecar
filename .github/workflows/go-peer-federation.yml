name: WOW Sidecar peer federation qualification

on:
  pull_request:
    paths:
      - 'go/**'
      - 'cmd/wow-sidecar/**'
      - 'scripts/gha_ephemeral_federation.py'
      - 'tests/test_gha_ephemeral_federation.py'
      - 'scripts/README-ephemeral-federation.md'
      - '.github/workflows/go-peer-federation.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  unit-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.13'
          check-latest: false
      - name: Static and race qualification
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          go vet ./...
          go test ./...
          go test -race ./go/federation ./go/node
          python3 -m unittest discover -s tests -p test_gha_ephemeral_federation.py -v

  two-node:
    needs: unit-race
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.13'
          check-latest: false

      - name: Build exact daemon
        id: build
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          version="0.0.0-dev.${sha:0:12}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64             go build -mod=readonly -trimpath -buildvcs=false             -ldflags="-s -w -X main.sourceRevision=$sha -X main.buildVersion=$version"             -o "$RUNNER_TEMP/wow-sidecar" ./cmd/wow-sidecar
          "$RUNNER_TEMP/wow-sidecar" version | jq -e --arg sha "$sha" '.source_revision == $sha'
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Two-node partition and re-embodiment rep
        id: federation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/gha_ephemeral_federation.py \
            --binary "$RUNNER_TEMP/wow-sidecar" \
            --revision "${{ steps.build.outputs.sha }}" \
            --receipt "$RUNNER_TEMP/peer-federation-receipt.json"

      - name: Preserve pre-harness failure receipt
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          FEDERATION_OUTCOME: ${{ steps.federation.outcome }}
        run: |
          if [ ! -e "$RUNNER_TEMP/peer-federation-receipt.json" ]; then
            python3 -c 'import json,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"peer-federation-receipt.json"; p.write_text(json.dumps({"schema":"wow-sidecar.ephemeral-federation-receipt.v1","status":"FAIL","stage":"before-harness","first_failure":"check_native_job_log","cleanup":"NOT_STARTED","build_outcome":os.environ["BUILD_OUTCOME"],"federation_outcome":os.environ["FEDERATION_OUTCOME"]},sort_keys=True)+"\n")'
          fi

      - name: Upload bounded federation receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wow-peer-federation-receipt
          path: ${{ runner.temp }}/peer-federation-receipt.json
          if-no-files-found: error
          retention-days: 7
