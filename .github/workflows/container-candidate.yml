name: WOW Sidecar container candidate

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/container-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Resolve exact Python base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          tag='python:3.12-slim'
          docker pull "$tag" >/dev/null
          ref="$(docker image inspect "$tag" --format '{{index .RepoDigests 0}}')"
          test -n "$ref"
          case "$ref" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "base image did not resolve to an exact digest" >&2; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build candidate
        shell: bash
        env:
          BASE_IMAGE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg "PYTHON_BASE=$BASE_IMAGE" \
            --build-arg "WOW_SOURCE_REVISION=$GITHUB_SHA" \
            -t wow-sidecar:candidate .
      - name: Verify embedded source identity and non-root runtime
        shell: bash
        run: |
          set -euo pipefail
          observed="$(docker run --rm --entrypoint python wow-sidecar:candidate -c \
            'from pathlib import Path; from wow_sidecar.deployment_identity import revision_from_file; print(revision_from_file(Path("/usr/share/wow-sidecar/source-revision")))')"
          test "$observed" = "$GITHUB_SHA"
          user="$(docker image inspect wow-sidecar:candidate --format '{{.Config.User}}')"
          test "$user" = 'wow-sidecar:wow-sidecar'
          image_id="$(docker image inspect wow-sidecar:candidate --format '{{.Id}}')"
          case "$image_id" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 1;; esac
          printf 'container-candidate source_revision=%s base=%s image_id=%s\n' \
            "$GITHUB_SHA" "${{ steps.base.outputs.ref }}" "$image_id"
