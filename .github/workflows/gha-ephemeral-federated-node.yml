name: Ephemeral WOW federation qualification
on:
  pull_request:
    paths:
      - 'scripts/gha_ephemeral_federation.py'
      - 'tests/test_gha_ephemeral_federation.py'
      - '.github/workflows/gha-ephemeral-federated-node.yml'
permissions:
  contents: read
jobs:
  ephemeral-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.13'
          check-latest: false
      - name: Qualify harness and run local WOW federation
        shell: bash
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_gha_ephemeral_federation.py -v
          sha="$(git rev-parse HEAD)"
          CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.sourceRevision=$sha -X main.buildVersion=0.0.0-gha" \
            -o "$RUNNER_TEMP/wow-sidecar" ./cmd/wow-sidecar
          python3 scripts/gha_ephemeral_federation.py \
            --binary "$RUNNER_TEMP/wow-sidecar" --revision "$sha" \
            --receipt "$RUNNER_TEMP/wow-ephemeral-receipt.json"
      - name: Preserve setup failure receipt
        if: always()
        shell: bash
        run: |
          if [ ! -e "$RUNNER_TEMP/wow-ephemeral-receipt.json" ]; then
            printf '%s\n' '{"schema":"wow-sidecar.ephemeral-federation-receipt.v1","status":"FAIL","stage":"before-harness","first_failure":"setup_or_build_failed","cleanup":"NOT_STARTED"}' > "$RUNNER_TEMP/wow-ephemeral-receipt.json"
          fi
      - name: Upload bounded receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wow-ephemeral-federation-receipt
          path: ${{ runner.temp }}/wow-ephemeral-receipt.json
          if-no-files-found: error
          retention-days: 7
