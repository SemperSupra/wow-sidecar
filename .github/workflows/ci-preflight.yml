name: WOW Sidecar pinned offline workflow lint

on:
  pull_request:
    paths:
      - 'scripts/ci-preflight.sh'
      - 'scripts/README-ci-preflight.md'
      - '.github/workflows/ci-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retrieve SHA-locked upstream actionlint
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git rev-parse HEAD
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          chmod 0755 "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Run pure static workflow preflight
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci-preflight.sh
          bash scripts/ci-preflight.sh --static
