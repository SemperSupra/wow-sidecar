name: WOW Sidecar read-only repository inventory qualification

on:
  pull_request:
    paths:
      - 'cmd/wow-repo-inventory/**'
      - '.github/workflows/go-repo-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.24.13'
          check-latest: false
      - name: Qualify exact source and read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          go vet ./cmd/wow-repo-inventory
          go test -race -count=1 ./cmd/wow-repo-inventory
          go run ./cmd/wow-repo-inventory > "$RUNNER_TEMP/inventory.json"
          python3 - "$RUNNER_TEMP/inventory.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data["schema"] == "wow-sidecar.local-repo-inventory.v1"
          assert data["repository_head"] and data["worktrees"]
          assert all("path" not in entry for entry in data["worktrees"])
          assert all("remote_url" not in entry for entry in data["worktrees"])
          print("inventory schema and redaction: PASS")
          PY
